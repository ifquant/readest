[package]
name = "tradeblazer_compiler"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "2.33.3", features = ["yaml"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.21"
once_cell = "1.19"
smallvec = "1.13"

[profile.release]
debug = true
